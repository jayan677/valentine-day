<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Be My Valentine 💘</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: "Poppins", sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: min(92%, 420px);
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            color: #4a1c2f;
            margin-bottom: 35px;
            line-height: 1.3;
        }

        .btn-container {
            position: relative;
            height: 80px;
            width: 100%;
        }

        button {
            position: absolute;
            padding: 14px 38px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yes {
            left: 10%;
            background: #ff4d6d;
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            z-index: 20;
        }

        #no {
            right: 10%;
            background: white;
            color: #888;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            z-index: 10;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            bottom: -20px;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            from { transform: translateY(0) rotate(0deg); opacity: 1; }
            to { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="romanticMusic" loop playsinline>
        <source src="audio/love-song.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <div style="font-size: 60px; margin-bottom: 15px;">🐱❤️</div>
        <h2>Dear Aarya,<br>will you be my Valentine?</h2>
        
        <div class="btn-container">
            <button id="yes">Yes 💖</button>
            <button id="no">No 🙈</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('romanticMusic');
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');

        // --- THE IPHONE AUDIO UNLOCK ---
        // iPhones block audio until the user touches the screen. 
        // This function plays it the moment she taps anywhere.
        function unlockAudio() {
            music.play().catch(e => console.log("Audio waiting for interaction"));
            // Once it plays once, we stop listening to avoid lag
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('click', unlockAudio);
        }
        window.addEventListener('touchstart', unlockAudio);
        window.addEventListener('click', unlockAudio);

        // --- NO BUTTON LOGIC ---
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents zoom/scroll on mobile
            moveNoButton();
        });

        // --- YES BUTTON LOGIC ---
        yesBtn.addEventListener('click', () => {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            setTimeout(() => {
                window.location.href = "yes.html";
            }, 1000);
        });

        // --- HEART BACKGROUND GENERATOR ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
