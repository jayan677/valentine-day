<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Be My Valentine 💘</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* --- General Layout --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: "Poppins", sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Main Content Card --- */
        .valentine-card {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            padding: 50px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .main-emoji {
            font-size: 70px;
            margin-bottom: 20px;
            display: block;
        }

        h2 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            color: #4a1c2f;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        /* --- Buttons --- */
        .btn-container {
            position: relative;
            height: 60px;
        }

        .action-btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: absolute;
        }

        #yes-btn {
            left: 5%;
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
        }

        #no-btn {
            right: 5%;
            background: white;
            color: #888;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        /* --- Floating Hearts --- */
        .heart-particle {
            position: absolute;
            bottom: -20px;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="valentine-card">
        <span class="main-emoji">🐱❤️</span>
        <h2>Dear Aarya,<br>will you be my Valentine?</h2>
        
        <div class="btn-container">
            <button id="yes-btn" class="action-btn">Yes 💖</button>
            <button id="no-btn" class="action-btn">No 🙈</button>
        </div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="audio/love-song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bg-music');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        // --- iPhone Music Activation ---
        // This plays the music as soon as the user touches the screen
        function startMusic() {
            music.play().catch(error => console.log("System waiting for touch..."));
            window.removeEventListener('touchstart', startMusic);
            window.removeEventListener('click', startMusic);
        }
        window.addEventListener('touchstart', startMusic);
        window.addEventListener('click', startMusic);

        // --- NO Button Interaction ---
        function runAway() {
            const x = Math.random() * 150;
            const y = Math.random() * 50;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', runAway);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); });

        // --- YES Button Interaction ---
        yesBtn.addEventListener('click', () => {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                window.location.href = 'yes.html';
            }, 1000);
        });

        // --- Background Hearts Animation ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
